[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "vasociety"
version = "0.1.0"
description = "Phase-1 multi-agent public-opinion simulation kernel"
readme = "README.md"
requires-python = ">=3.11"
authors = [{name = "VASociety Team"}]
dependencies = []

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
]

[project.scripts]
vasociety = "vasociety.cli.main:main"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
