{
  "seed": 7,
  "steps": 10,
  "log_level": "INFO",
  "agent_population": {
    "count": 20,
    "topics": ["healthcare", "economy", "education"]
  },
  "feed": {
    "max_items": 8,
    "view_top_k": 3,
    "weights": {
      "heat": 1.2,
      "freshness": 0.8,
      "topic_match": 1.3,
      "stance_affinity": 0.5,
      "official_boost": 1.5,
      "source_trust": 0.2,
      "social_proximity": 0.1,
      "novelty": 0.3
    }
  },
  "output": {
    "output_dir": "outputs/demo_run",
    "snapshot_each_step": true,
    "write_decision_trace": true
  },
  "interventions": [
    {
      "intervention_id": "iv_news_1",
      "step": 1,
      "type": "inject_news",
      "payload": {
        "content": "突发：某地公共资源调配异常，引发社会广泛关注。",
        "topic": "healthcare",
        "stance": "uncertain",
        "source_type": "official",
        "visibility": "public"
      }
    },
    {
      "intervention_id": "iv_fact_1",
      "step": 5,
      "type": "inject_fact_check",
      "payload": {
        "content": "权威通报：此前传播的部分信息不准确，已发布核查结果。",
        "topic": "healthcare",
        "stance": "corrective",
        "source_type": "official",
        "visibility": "public"
      }
    }
  ]
}
